name: Privacy Scan

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  privacy-scan:
    name: Scan diff for private data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test privacy scanner with synthetic cases
        run: python3 scripts/privacy_scan_test.py

      - name: Scan pull request (generic rules, no secrets)
        if: github.event_name == 'pull_request'
        run: python3 scripts/privacy_scan.py

      - name: Scan trusted push (generic and optional private rules)
        if: github.event_name == 'push'
        env:
          # Python regex; never passed to pull-request code or printed.
          PRIVACY_PATTERN: ${{ secrets.PRIVACY_PATTERN }}
        run: python3 scripts/privacy_scan.py
